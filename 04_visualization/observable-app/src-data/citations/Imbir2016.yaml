notes: >
  "ANPW_R" (Affective Norms for Polish Words - Reload) extends the
  author's own earlier ANPW dataset (parent_bibtex: Imbir2015, 1,586
  words - already in this collection) to 4,905 words. Verified: all 1,586
  ANPW words are present in ANPW_R (expected - this is a superset/reload
  of the same source, not independent duplicate data); valence/arousal/
  dominance/origin/significance were re-collected under the reload's own
  protocol (400 participants, 50 ratings/word, 25 women + 25 men) rather
  than copied from the original ANPW values. Concreteness, imageability,
  and age of acquisition are new to this dataset and were not present in
  Imbir2015. Also checked against Riegel2015 (NAWL, 2,902 Polish words,
  a fully independent norming project): 1,274 words incidentally overlap
  by vocabulary, which is expected for two large general-Polish-word
  samples and is not a data-duplication concern. Column names fixed from
  the source spreadsheet's typos: "part of speach" to pos, "concretness"
  to concrete, "imegability" to imagine, "ageOfAquisition" to aoa, to
  match this collection's naming convention.
