notes: >
  Only the word-norming subset (Experiment 1, "Words" version) of the
  dataset is included here - the paper also norms 1,000 images (500 unique
  images in color/grayscale from the Multilingual Picture Database), which
  are not word-level data and were not converted. Five socio-semantic
  dimensions were rated on 7-point scales: gender (masculine-feminine),
  location (rural-urban), political alignment (liberal-conservative),
  valence (negative-positive), plus age association (categorical checkbox
  across 7 age bands, summarized here as 3 PCA components, the modal age
  band, and per-band endorsement proportions). "_latent_mean" and
  "_entropy" columns are IRT-adjusted means and response-diversity measures
  from the paper's own processing pipeline, not raw sample means, kept
  alongside the raw mean/sd/n for each dimension. grammatical_gender_czech
  is the word's linguistic gender (m/f/n), NOT the socio-semantic gender
  rating - kept distinct to avoid confusion with gender_mean. No
  concreteness measure is included in this dataset. Checked against
  existing Czech entries in this collection (Luniewska2019_cs, an
  unrelated 299-word age-of-acquisition norm set) - no overlap in words,
  measures, or source.
