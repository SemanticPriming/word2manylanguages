notes: >
  Words extracted from the Reference Corpus of Current Galician (CORGA),
  focusing on frequent nouns and adjectives. Ratings from bilingual
  Galician-Spanish university students (Universidad de Vigo) on 9-point
  Likert scales (AoA on a different scale). No prior Galician dataset in
  this collection overlaps with NORGAL's measures - the only other
  Galician-language entry is Granja2025 (the Galician MultiPic picture
  dataset: name agreement/familiarity from picture naming, no
  concreteness/valence/arousal/imageability/AoA ratings), so this is a
  genuinely new addition rather than a duplicate.
